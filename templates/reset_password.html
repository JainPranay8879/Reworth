{% extends "base.html" %}
{% block title %}Reset Password — ReWorth{% endblock %}
{% block content %}
<section class="admin-login-wrap"><div class="admin-login-card">
  <div class="admin-badge">ACCOUNT RECOVERY</div><p class="eyebrow">NEW PASSWORD</p><h1>Choose a <em>new password.</em></h1>
  {% if valid %}<form method="post" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New password<input name="password" type="password" minlength="8" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="8" required></label><button class="button full" type="submit">Reset password →</button></form>{% else %}<p class="admin-muted">This reset link is invalid, expired or has already been used.</p><a class="button full" href="{{ url_for('forgot_password') }}">Request a new reset link</a>{% endif %}
</div></section>
{% endblock %}
